<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sphere — a map of places &amp; stories</title>
  </head>
  <body>
    <div id="map"></div>

    <!-- Side panel: shows a place's photo + narrative -->
    <aside id="panel" class="panel hidden">
      <button id="panel-close" class="panel-close" aria-label="Close">&times;</button>
      <div id="panel-content"></div>
    </aside>

    <!-- Tour controls -->
    <div id="tour-bar" class="tour-bar">
      <button id="tour-start" class="btn btn-primary">▶ Start tour</button>
      <div id="tour-nav" class="tour-nav hidden">
        <button id="tour-prev" class="btn">‹ Prev</button>
        <span id="tour-progress" class="tour-progress"></span>
        <button id="tour-next" class="btn">Next ›</button>
        <button id="tour-exit" class="btn btn-ghost">Exit</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
